<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite Sheet Preview</title>
<style>
  :root { --bg: #6e6e76; --fg: #f4f4f4; --muted: #d0d0d8; --card: #64646c; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 12px/1.3 monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  h2 { font-size: 13px; margin: 20px 0 8px; color: var(--muted); }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .cell { background: var(--card); padding: 6px; border-radius: 4px; text-align: center; }
  .cell canvas { display: block; margin: 0 auto 4px; image-rendering: pixelated; }
  .cell .pal { color: var(--muted); font-size: 10px; }
  .row { display: flex; gap: 6px; justify-content: center; }
  #err { color: #ffb0b0; white-space: pre; }
</style>
</head>
<body>
<h1>The Hollow Crown - sprites</h1>
<div>Every sprite at 3x in its default palette. Enemy sprites are also shown in the red and blue palettes.</div>
<div id="err"></div>
<div id="out"></div>
<script src="../js/sprites.js"></script>
<script>
(function () {
  var SCALE = 3;
  var ENEMY_PALS = ['red', 'blue', 'green', 'gold', 'purple', 'white', 'brown', 'gray', 'orange', 'dark'];
  var out = document.getElementById('out');
  if (typeof SPRITES === 'undefined') {
    document.getElementById('err').textContent = 'sprites.js failed to load';
    return;
  }
  function draw(name, pal) {
    var src = getSprite(name, pal);
    var c = document.createElement('canvas');
    c.width = src.width * SCALE; c.height = src.height * SCALE;
    var x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    x.drawImage(src, 0, 0, c.width, c.height);
    return c;
  }
  function group(name) {
    if (/^hero/.test(name)) return 'Hero';
    if (/^npc/.test(name)) return 'NPCs';
    if (/^(tile_|door_)/.test(name)) return 'Tiles';
    if (/^(heart_full|heart_half|heart_empty|icon_)/.test(name)) return 'HUD';
    if (/^(thornhorn|coil|hydra|pulsar|dragon|beast|orbit|king)/.test(name)) return 'Bosses';
    var pal = SPRITES[name].pal;
    if (ENEMY_PALS.indexOf(pal) >= 0 && !/^(spear$|pebble|puff|hit_spark|potion|ring|shield|bow|star|bombbag|book)/.test(name)) return 'Enemies';
    return 'Items / weapons / effects';
  }
  var groups = {}, order = [];
  Object.keys(SPRITES).forEach(function (n) {
    var g = group(n);
    if (!groups[g]) { groups[g] = []; order.push(g); }
    groups[g].push(n);
  });
  order.forEach(function (g) {
    var h = document.createElement('h2'); h.textContent = g + ' (' + groups[g].length + ')';
    out.appendChild(h);
    var grid = document.createElement('div'); grid.className = 'grid';
    groups[g].forEach(function (n) {
      var def = SPRITES[n];
      var cell = document.createElement('div'); cell.className = 'cell';
      var row = document.createElement('div'); row.className = 'row';
      row.appendChild(draw(n));
      if (g === 'Enemies' || g === 'Bosses') {
        ['red', 'blue'].forEach(function (p) { if (p !== def.pal) row.appendChild(draw(n, p)); });
      }
      cell.appendChild(row);
      var lab = document.createElement('div'); lab.textContent = n;
      var pl = document.createElement('div'); pl.className = 'pal';
      pl.textContent = def.w + 'x' + def.h + ' ' + def.pal;
      cell.appendChild(lab); cell.appendChild(pl);
      grid.appendChild(cell);
    });
    out.appendChild(grid);
  });
  // unknown sprite fallback check
  var bad = getSprite('__nope__');
  var note = document.createElement('h2');
  note.textContent = 'Fallback for unknown name: ' + bad.width + 'x' + bad.height + ' magenta';
  out.appendChild(note);
  out.appendChild(draw('__nope__'));
})();
</script>
</body>
</html>
